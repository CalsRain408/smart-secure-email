# Mail domain A. Activate with profile `domain-a`.
ssm:
  domain:
    id: domain-a
    name: ${SSM_DOMAIN_NAME:domain-a.test}
    display-name: ${SSM_DOMAIN_DISPLAY_NAME:Domain A Corp}

server:
  port: ${SSM_SERVER_PORT:8081}
  servlet:
    session:
      cookie:
        # Distinct per domain: browsers do not separate cookies by port, so two instances
        # on the same host (localhost demo) would otherwise overwrite each other's session.
        name: SSM_SESSION_A
